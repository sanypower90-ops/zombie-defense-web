name: Build and publish Zombie Defense 100

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
      - name: Import resources
        run: godot --headless --path game --import
      - name: Check game startup and pickups
        run: godot --headless --path game --script res://tests/smoke_test.gd
      - name: Check isolated sprite textures and facing
        run: godot --headless --path game --script res://tests/sprite_visuals_test.gd
      - name: Check illustrated abilities and reference effects
        run: godot --headless --path game --script res://tests/ability_effects_test.gd
      - name: Check travelling ability attacks and cover
        run: godot --headless --path game --script res://tests/ability_combat_test.gd
      - name: Check boss combat and hit protection
        run: godot --headless --path game --script res://tests/boss_hit_test.gd
      - name: Export Web game
        run: |
          mkdir -p build/web
          godot --headless --path game --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload playable build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
